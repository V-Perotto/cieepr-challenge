# Orquestração local (constituição, Princípio I). Uso: cp .env.example .env && docker compose up --build
name: cieepr-challenge

services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    # A imagem do SQL Server é publicada só para amd64 (em ARM, use a emulação x86 do Docker).
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # sqlcmd do pacote mssql-tools18 (confirmado na imagem 2025); -C aceita o certificado autoassinado.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 1433
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL}
      PDF_EXTRACTION_TIMEOUT_MS: ${PDF_EXTRACTION_TIMEOUT_MS}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mssql-data:
